<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — AI Prep Coach</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--color-canvas);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .login-card {
      width: 100%;
      background: var(--color-surface);
      border: 1px solid var(--color-hairline-solid);
      border-radius: var(--radius-card);
      padding: 44px 40px;
      text-align: center;
    }

    .login-logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }

    .login-title {
      font-family: var(--font-display);
      font-size: 30px;
      color: var(--color-ink);
      line-height: 1.15;
      margin-bottom: 8px;
    }

    .login-subline {
      font-size: 14px;
      color: var(--color-ink-muted);
      line-height: 1.5;
      margin-bottom: 30px;
    }

    .login-footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--color-ink-muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="login-container">
    <div class="login-card">
      <!-- Logo Variant A (44x44) -->
      <div class="login-logo-wrap">
        <svg width="44" height="44" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="AI Prep Coach Logo">
          <rect width="28" height="28" rx="7.28" fill="#C2452D"/>
          <text x="13.5" y="20.5" font-family="'DM Serif Display', Georgia, serif" font-size="20" fill="#FFF8F0" text-anchor="middle">A</text>
          <circle cx="21" cy="21" r="2.2" fill="#6B7F3B"/>
        </svg>
      </div>

      <h1 class="login-title">AI Prep Coach</h1>
      <p class="login-subline">Welcome back — your practice, judged by code.</p>

      <form action="home.html" method="get" onsubmit="event.preventDefault(); window.location.href='home.html';">
        <div class="form-group">
          <label class="form-label" for="login-email">Email address</label>
          <input class="form-input" id="login-email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label class="form-label" for="login-password">Password</label>
          <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn btn-terracotta" style="width: 100%; justify-content: center; padding: 14px 24px; font-size: 15px;">
          Log In
        </button>

        <div style="margin-top: 18px;">
          <a href="#" style="color: var(--color-mediterranean); text-decoration: none; font-size: 13px; font-weight: 500;">Forgot password?</a>
        </div>

        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--color-hairline-subtle);">
          <a href="#" class="btn btn-outline" style="width: 100%; justify-content: center; padding: 12px 24px; font-size: 14px; text-decoration: none;">
            Create account
          </a>
        </div>
      </form>
    </div>

    <!-- Honest Local Profile Note -->
    <div class="login-footer-note">
      Local profile — your data stays on this device.
    </div>
  </main>
</body>
</html>
